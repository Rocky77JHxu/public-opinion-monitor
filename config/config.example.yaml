app:
  name: opinion-monitor
  environment: development
  timezone: Asia/Shanghai
  log_level: INFO
  log_format: console

storage:
  backend: sqlite
  sqlite:
    path: data/opinion_monitor.db
  postgres:
    dsn_env: POSTGRES_DSN
  raw_retention_days: 30
  processed_retention_days: 180

scheduler:
  enabled: true
  max_concurrent_tasks: 3
  task_timeout_seconds: 1800
  missed_task_policy: skip

hotsearch:
  defaults:
    enabled: true
    interval_seconds: 300
    jitter_min_seconds: 15
    jitter_max_seconds: 45
    timeout_seconds: 15
    max_retries: 2

  platforms:
    weibo:
      enabled: true
      url: https://s.weibo.com/top/summary
      parser: html
      weight: 90
    baidu:
      enabled: true
      url: https://top.baidu.com/board?tab=realtime
      parser: html
      weight: 85
    zhihu:
      enabled: true
      url: https://www.zhihu.com/hot
      parser: html
      weight: 80
    douyin:
      enabled: true
      url: https://www.douyin.com/aweme/v1/web/hot/search/list/
      parser: json
      weight: 90
    bilibili:
      enabled: true
      url: https://api.bilibili.com/x/web-interface/search/square?limit=50
      parser: json
      weight: 75

keyword_search:
  defaults:
    enabled: true
    interval_seconds: 1800
    jitter_min_seconds: 300
    jitter_max_seconds: 600
    max_items_per_keyword: 20
    enable_comments: true
    max_comments_per_item: 50

  levels:
    level_1:
      enabled: true
      weight: 100
      interval_seconds: 1800
      jitter_min_seconds: 300
      jitter_max_seconds: 600
      platforms: [xhs, dy, ks, bili, wb, tieba, zhihu]
      keywords: []
    level_2:
      enabled: true
      weight: 80
      interval_seconds: 1800
      jitter_min_seconds: 300
      jitter_max_seconds: 600
      platforms: [xhs, dy, ks, bili, wb, tieba, zhihu]
      keywords: []
    level_3:
      enabled: false
      weight: 60
      interval_seconds: 3600
      jitter_min_seconds: 600
      jitter_max_seconds: 1200
      platforms: [xhs, dy, wb]
      keywords: []

account_search:
  defaults:
    enabled: true
    interval_seconds: 10800
    jitter_min_seconds: 600
    jitter_max_seconds: 1800
    max_items_per_account: 30
    enable_comments: true
    max_comments_per_item: 50

  # 请替换为你的部署已被授权使用的账号 ID。
  accounts: {}

mediacrawler:
  root: third_party/MediaCrawler
  save_option: jsonl
  save_path: data/media_crawler
  login_type: qrcode
  enable_cdp_mode: true
  enable_cdp_connect_existing: true
  cdp_debug_port: 9222
  enable_get_comments: true
  max_comments_per_note: 50
  enable_sub_comments: false
  max_concurrency: 1
  max_sleep_seconds: 2

processing:
  date_filter:
    max_age_hours: 72
    missing_published_at_policy: keep_for_manual_review

  deduplication:
    url:
      enabled: true
      strip_query_params:
        - utm_source
        - utm_medium
        - utm_campaign
        - share_token
    content:
      enabled: true
      algorithm: simhash
      title_similarity_threshold: 0.90
      content_similarity_threshold: 0.88
      cross_platform_merge: true

  hotsearch_expansion:
    enabled: true
    max_items_per_hotword: 10
    platforms: [wb, dy, xhs, bili, zhihu]

rules:
  categories:
    sudden_event:
      label: 突发事件类
      weight: 100
      keywords: [爆炸, 爆燃, 起火, 火灾, 坍塌, 塌方, 垮塌, 交通事故, 车祸, 追尾, 矿难, 瓦斯, 透水, 泄漏, 毒气, 化学品泄漏, 坠机, 坠毁, 沉船, 翻船, 踩踏, 施工事故, 高处坠落, 触电, 机械伤害, 溺水, 地震, 余震, 震感, 洪水, 汛情, 决堤, 内涝, 台风, 山体滑坡, 泥石流, 暴雪, 冰雹, 龙卷风, 地陷, 地面塌陷, 森林火灾, 食物中毒, 集体腹泻, 集体呕吐, 疑似食物中毒, 疫情, 聚集性疫情, 传染病, 职业中毒, 饮用水污染, 水质异常, 疫苗异常, 持刀伤人, 砍伤, 刺伤, 无差别伤人, 报复社会, 劫持, 人质, 纵火, 投毒, 爆炸物, 可疑包裹, 持刀, 行凶]
    mass_event:
      label: 群众性事件类
      weight: 95
      keywords: [聚集, 聚集上访, 群体聚集, 围堵, 堵门, 堵路, 堵桥, 罢工, 罢运, 罢市, 停工, 讨薪, 讨要工资, 静坐, 拉横幅, 举牌子, 集体维权, 聚集维权, 医闹, 校闹, 聚集讨说法]
    police_stability:
      label: 涉警涉稳类
      weight: 92
      keywords: [警察打人, 暴力执法, 执法冲突, 涉案警察, 辅警打人, 协警, 警车事故, 派出所, 警民冲突, 袭警, 辱警, 阻碍执法, 假警察, 冒充警察, 警察涉案, 看守所, 在押人员]
    livelihood_sensitive:
      label: 民生敏感类
      weight: 75
      keywords: [拆迁, 征地, 强制拆除, 补偿款, 欠薪, 拖欠工资, 农民工讨薪, 物业纠纷, 停水, 停电, 停气, 供暖, 房价, 烂尾楼, 延期交房, 校园安全, 校园霸凌, 欺凌, 体罚, 食堂卫生, 医疗纠纷, 医患冲突, 环境污染, 偷排, 异味, 排放超标, 食品安全, 过期食品, 黑作坊, 养老, 养老院, 疫苗, 学区, 入学难, 强制消费]
    cyber_fraud:
      label: 网络与诈骗专项
      weight: 85
      keywords: [数据泄露, 信息泄露, 个人信息泄露, 黑客攻击, 网站被黑, 勒索病毒, 系统瘫痪, 宕机, 网络攻击, 钓鱼网站, 撞库, 电信诈骗, 刷单返利, 杀猪盘, 冒充公检法, 虚假投资, 虚假理财, 集资诈骗, 养老诈骗, 冒充客服, 机票退改签诈骗]
    other:
      label: 其他
      weight: 30
      keywords: []

source_weights:
  official_authority: 100
  mainstream_media: 90
  local_media: 85
  verified_institution_account: 85
  verified_personal_account: 70
  ordinary_social_media: 60
  anonymous_or_unverified: 45
  default: 50

platform_heat:
  weibo:
    top_rank_weight: 95
    hot_value_field: hot_score
  douyin:
    top_rank_weight: 90
    hot_value_field: hot_value
  baidu:
    top_rank_weight: 85
    hot_value_field: hot_score
  zhihu:
    top_rank_weight: 80
    hot_value_field: hot_score
  bilibili:
    top_rank_weight: 75
    hot_value_field: score

scoring:
  normalization:
    min: 0
    max: 100
  weights:
    keyword_category: 0.25
    source: 0.10
    heat: 0.15
    llm_category: 0.15
    sentiment: 0.15
    llm_risk: 0.20

alert_levels:
  red:
    label: 红色 - 立即处置
    min_score: 85
  orange:
    label: 橙色 - 关注核实
    min_score: 70
  blue:
    label: 蓝色 - 记录归档
    min_score: 40
  archive:
    label: 归档
    min_score: 0

sentiment:
  model: openai_compatible
  categories:
    - strong_negative
    - negative
    - angry
    - anxious
    - distrustful
    - questioning
    - neutral
    - positive
    - supportive
    - mixed
    - invalid
  weights:
    strong_negative: 100
    negative: 75
    angry: 95
    anxious: 80
    distrustful: 75
    questioning: 50
    neutral: 40
    positive: 10
    supportive: 5
    mixed: 50
    invalid: 0

llm:
  provider: openai_compatible
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  temperature: 0.1
  max_output_tokens: 2000
  timeout_seconds: 60
  max_retries: 2
  enable_structured_output: true
  prompt_dir: config/prompts

output:
  dingtalk:
    enabled: true
    webhook_url_env: DINGTALK_AUTOMATION_WEBHOOK_URL
    timeout_seconds: 15
    max_retries: 3
    retry_backoff_seconds: 5
    send_mode: automation_json
    dry_run: true
    levels:
      red:
        enabled: true
        immediate: true
      orange:
        enabled: true
        immediate: true
      blue:
        enabled: true
        immediate: false
      archive:
        enabled: false
        immediate: false

security:
  allow_private_network: false
  validate_ssl: true
  redact_phone_numbers: true
  redact_id_numbers: true
  mask_user_ids_in_output: true
